<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossPointer Windows host proof</title>
  <style>
    :root {
      --page: #f5f5f3;
      --surface: #fff;
      --border: #d8d8d4;
      --border-strong: #b9b9b3;
      --text: #1d1d1b;
      --text-quiet: #5f5f5a;
      --accent: #e24b4a;
      --danger: #a6312e;
      --ok: #28784c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--page);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    .controls, .button-grid {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 0 0 12px;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-quiet);
    }
    .controls output { min-width: 30px; color: var(--text); }
    button {
      font: inherit;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible {
      outline: 2px solid #378add;
      outline-offset: 2px;
    }
    button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }
    section {
      margin: 18px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }
    h1 { margin-top: 0; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    #trackpad {
      position: relative;
      height: 260px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
    }
    #trackpad::before, #trackpad::after {
      position: absolute;
      color: var(--text-quiet);
      pointer-events: none;
    }
    #trackpad::before {
      content: "Laser test pad";
      top: 18px;
      left: 20px;
      font-size: 16px;
      font-weight: 600;
    }
    #trackpad::after {
      content: "Move here to aim · click to trigger a pop";
      left: 20px;
      bottom: 18px;
    }
    #status { min-height: 1.4em; color: var(--text-quiet); }
    #capabilities {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin: 0;
    }
    .capability {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--text-quiet);
    }
    .capability strong { color: var(--ok); }
    #log {
      min-height: 80px;
      margin: 0;
      padding: 10px;
      overflow: auto;
      background: #f1f1ed;
      color: var(--text-quiet);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre-wrap;
    }
    #pairing-card { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: center; }
    #pairing-qr { width: 240px; height: 240px; image-rendering: pixelated; }
    #pairing-url { overflow-wrap: anywhere; color: var(--text-quiet); }
    #pending-list { display: grid; gap: 8px; }
    .pending { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    @media (max-width: 620px) { #pairing-card { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Windows host proof</h1>
    <section aria-labelledby="pairing-heading">
      <h2 id="pairing-heading">Connect a controller</h2>
      <div id="pairing-card">
        <img id="pairing-qr" alt="QR code for CrossPointer controller pairing">
        <div>
          <p>Scan this code from a phone on the same Wi-Fi network, then approve the device below.</p>
          <p id="pairing-url">Starting local server…</p>
          <button id="regenerate-pairing" type="button">Regenerate QR / New Pairing</button>
          <div id="pending-list" aria-live="polite"></div>
        </div>
      </div>
    </section>
    <section aria-labelledby="laser-heading">
      <h2 id="laser-heading">Laser overlay</h2>
      <div class="controls">
        <button id="toggle" type="button">Pointer Off</button>
        <label>Laser Size
          <input id="size" type="range" min="40" max="130" value="85" step="1">
          <output id="size-value">85</output>
        </label>
        <label>Dot Spacing
          <input id="dot-spacing" type="range" min="6" max="16" value="9" step="1">
          <output id="dot-spacing-value">9</output>
        </label>
        <label>Pop Speed
          <input id="pop-speed" type="range" min="0" max="3" value="1.2" step="0.1">
          <output id="pop-speed-value">1.2</output>
        </label>
        <button id="kick" type="button">Trigger Pop/Kick</button>
      </div>
      <div id="trackpad" role="application" aria-label="Laser test pad"></div>
    </section>

    <section aria-labelledby="presentation-heading">
      <h2 id="presentation-heading">Presentation actions</h2>
      <div class="button-grid">
        <button data-action="next" type="button">Next Slide</button>
        <button data-action="previous" type="button">Previous Slide</button>
        <button data-action="start" type="button">Start (F5)</button>
        <button data-action="exit" type="button">Exit (Esc)</button>
        <button data-action="blank" type="button">Blank Screen (B)</button>
      </div>
      <div class="button-grid">
        <button id="drag" type="button">Test Drag &amp; Drop</button>
        <button id="emergency" class="danger" type="button">Emergency Stop / Release All</button>
      </div>
      <p>Emergency shortcut: Ctrl+Shift+H</p>
    </section>

    <section aria-labelledby="capabilities-heading">
      <h2 id="capabilities-heading">Host capabilities</h2>
      <div id="capabilities">Loading capabilities…</div>
    </section>

    <section aria-labelledby="diagnostics-heading">
      <h2 id="diagnostics-heading">Diagnostic log</h2>
      <pre id="log" aria-live="polite"></pre>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script>
    (() => {
      const api = window.crossPointerProof;
      const pairingUrl = document.getElementById('pairing-url');
      const pairingQr = document.getElementById('pairing-qr');
      const pendingList = document.getElementById('pending-list');
      const regeneratePairing = document.getElementById('regenerate-pairing');
      const toggle = document.getElementById('toggle');
      const size = document.getElementById('size');
      const dotSpacing = document.getElementById('dot-spacing');
      const popSpeed = document.getElementById('pop-speed');
      const trackpad = document.getElementById('trackpad');
      const status = document.getElementById('status');
      const logPanel = document.getElementById('log');
      const values = {
        size: document.getElementById('size-value'),
        dotSpacing: document.getElementById('dot-spacing-value'),
        popSpeed: document.getElementById('pop-speed-value'),
      };
      let on = false;
      let logEntries = [];
      let pending = [];

      function renderPending() {
        pendingList.innerHTML = pending.length === 0
          ? '<p>No connected controller devices.</p>'
          : pending.map((device) => device.state === 'pending'
            ? `<div class="pending"><span>New Controller Device connected.</span><span><button data-approve="${device.id}" type="button">Approve</button><button data-deny="${device.id}" class="danger" type="button">Deny</button></span></div>`
            : `<div class="pending"><span>Authorized controller device</span><button data-revoke="${device.id}" class="danger" type="button">Revoke / Disconnect device</button></div>`).join('');
        pendingList.querySelectorAll('[data-approve]').forEach((button) => {
          button.addEventListener('click', () => api.approvePairing(button.dataset.approve));
        });
        pendingList.querySelectorAll('[data-deny]').forEach((button) => {
          button.addEventListener('click', () => api.denyPairing(button.dataset.deny));
        });
        pendingList.querySelectorAll('[data-revoke]').forEach((button) => {
          button.addEventListener('click', () => api.revokePairing(button.dataset.revoke));
        });
      }

      function log(message) {
        logEntries = [`${new Date().toLocaleTimeString()} ${message}`, ...logEntries].slice(0, 8);
        logPanel.textContent = logEntries.join('\n');
        status.textContent = message;
      }

      function run(label, operation) {
        operation.then(() => log(`${label}: OK`)).catch((error) => log(`${label}: ${error.message}`));
      }

      function config() {
        return {
          on,
          size: Number(size.value),
          dotSpacing: Number(dotSpacing.value),
          popSpeed: Number(popSpeed.value),
        };
      }

      function sendConfig() {
        const nextConfig = config();
        values.size.value = nextConfig.size;
        values.dotSpacing.value = nextConfig.dotSpacing;
        values.popSpeed.value = nextConfig.popSpeed.toFixed(1);
        run('Laser configuration', api.updateLaserConfig(nextConfig));
      }

      function sendPosition(event) {
        const rect = trackpad.getBoundingClientRect();
        const localX = Math.max(0, Math.min(rect.width, event.clientX - rect.left));
        const localY = Math.max(0, Math.min(rect.height, event.clientY - rect.top));
        const screenX = (window.screen.availLeft || 0) + window.screen.width * localX / rect.width;
        const screenY = (window.screen.availTop || 0) + window.screen.height * localY / rect.height;
        run('Laser position', api.setOverlayPosition(screenX, screenY));
      }

      function renderCapabilities(capabilities) {
        const rows = [
          ['Relative Move', capabilities.relativeMove],
          ['Absolute Laser', capabilities.absoluteLaser],
          ['Presentation Keys', capabilities.presentationKeys],
        ];
        document.getElementById('capabilities').innerHTML =
          `<div class="capability"><span>${capabilities.platform}</span><strong>Supported</strong></div>` +
          rows.map(([label, supported]) =>
            `<div class="capability"><span>${label}</span><strong>${supported ? '✓' : '—'}</strong></div>`
          ).join('');
        log('Host capabilities loaded');
      }

      toggle.addEventListener('click', () => {
        on = !on;
        toggle.textContent = on ? 'Pointer On' : 'Pointer Off';
        sendConfig();
      });
      [size, dotSpacing, popSpeed].forEach((control) => control.addEventListener('input', sendConfig));
      trackpad.addEventListener('pointermove', sendPosition);
      trackpad.addEventListener('pointerdown', (event) => {
        sendPosition(event);
        run('Laser pop', api.kickLaser());
      });
      document.getElementById('kick').addEventListener('click', () => run('Laser pop', api.kickLaser()));
      document.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', () => {
          const action = button.dataset.action;
          run(`Presentation ${action}`, api.pressPresentationAction(action));
        });
      });
      document.getElementById('drag').addEventListener('click', () => {
        run('Drag test', api.buttonDown('left')
          .then(() => api.moveRelative(160, 0))
          .then(() => api.buttonUp('left')));
      });
      document.getElementById('emergency').addEventListener('click', () => {
        run('Emergency stop', api.emergencyHide());
      });

      api.getPairingInfo().then((info) => {
        pairingUrl.textContent = info.url;
        pairingQr.src = info.qrDataUrl;
      }).catch((error) => log(`Pairing server: ${error.message}`));
      regeneratePairing.addEventListener('click', () => {
        regeneratePairing.disabled = true;
        api.regeneratePairing().then((info) => {
          pairingUrl.textContent = info.url;
          pairingQr.src = info.qrDataUrl;
          log('New pairing QR generated');
        }).catch((error) => log(`Pairing server: ${error.message}`))
          .finally(() => { regeneratePairing.disabled = false; });
      });
      api.onPairingPending((nextPending) => {
        pending = nextPending;
        renderPending();
      });
      renderPending();
      run('Capability query', api.getCapabilities().then(renderCapabilities));
      sendConfig();
    })();
  </script>
</body>
</html>
